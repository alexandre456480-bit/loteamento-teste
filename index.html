<body>
  <main id="viewer" aria-label="Maquete 3D do Residencial Parque Universitário"></main>

  <div class="view-caption"><span class="status-dot"></span><span id="view-name">Perspectiva geral</span></div>

  <footer class="help"><span>Arraste para mover</span><b>·</b><span>Scroll para aproximar</span><b>·</b><span>Botão direito para girar</span></footer>
  <div id="loading"><div class="loading-symbol"></div><p>Construindo a implantação<span>Preparando quadras, vias e paisagismo</span></p></div>
  <script type="module" src="/src/main.js"></script>
